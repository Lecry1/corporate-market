<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}КорпМаркет{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'adverts:list' %}">
            КорпМаркет
        </a>

        <div class="ms-auto d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
                <a
                    href="{% url 'users:profile' %}"
                    class="d-flex align-items-center gap-2 text-decoration-none link-body-emphasis"
                >
                    {% if user.photo %}
                        <img
                            src="{{ user.photo.url }}"
                            alt="Аватар {{ user.username }}"
                            class="rounded-circle object-fit-cover"
                            width="36"
                            height="36"
                        >
                    {% else %}
                        <span
                            class="rounded-circle bg-secondary-subtle d-inline-flex
                                   align-items-center justify-content-center fw-semibold"
                            style="width: 36px; height: 36px;"
                        >
                            {{ user.username|first|upper }}
                        </span>
                    {% endif %}

                    <span>{{ user.username }}</span>
                </a>

                <a
                    class="btn btn-primary"
                    href="{% url 'adverts:create' %}"
                >
                    Создать объявление
                </a>

                <form
                    method="post"
                    action="{% url 'users:logout' %}"
                    class="m-0"
                >
                    {% csrf_token %}

                    <button
                        class="btn btn-outline-secondary"
                        type="submit"
                    >
                        Выйти
                    </button>
                </form>
            {% else %}
                <a
                    class="btn btn-outline-primary"
                    href="{% url 'users:login' %}"
                >
                    Войти
                </a>

                <a
                    class="btn btn-primary"
                    href="{% url 'users:register' %}"
                >
                    Регистрация
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container pb-4">
    {% block content %}
    {% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
